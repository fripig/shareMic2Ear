schema: spec-driven

context: |
  shareMic2Ear：瀏覽器端的多路麥克風即時監聽工具。
  把一支或多支麥克風的收音混音後，導向指定的音訊輸出裝置，主要情境是藍牙耳機監聽。

  技術棧：單一 index.html，內嵌全部 CSS 與 JS，零依賴、零建置。
  核心 API 是 Web Audio API、getUserMedia、enumerateDevices、setSinkId。
  部署在 GitHub Pages（main 分支 root），線上位址 https://fripig.github.io/shareMic2Ear/

  撰寫規格時要知道的前提：
  - 這個領域的限制多於設計空間。網頁無法配對藍牙、無法得知裝置連線類型、
    行動裝置無法指定輸出、藍牙麥克風必然降為 HFP。這些都不可繞過。
  - 面對限制的一致做法是「誠實說明，並指出使用者在哪一層能真正解決」，
    不做無效的網頁層補償。
  - 能力偵測一律用 `'api' in X.prototype` 實際偵測，不用 UA 判斷。
    平台判斷只用於產生說明文案，不參與功能決策。
  - 量測用的 AnalyserNode 一律掛旁路，不得進入音訊主路徑。
  - 麥克風授權需要真人操作，音訊行為無法自動化測試，只能人工聽測。
    自動化涵蓋語法、HTML/JS 結構對照、純函式邏輯與部署一致性。

  慣例：使用者介面提供繁體中文與英文兩種語言，所有文案都必須同時寫進兩份字典
  （字典內嵌於 index.html，見 localization 規格）；程式註解與 commit 訊息維持既有語言
  （註解繁體中文、commit 訊息英文）。

